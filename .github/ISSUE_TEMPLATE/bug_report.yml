name: Bug report
description: Something in the ClickHouse adapter does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A security problem goes to a private report instead (see SECURITY.md). A bug that shows up with every Lotus source, not only ClickHouse, belongs in the Lotus repository.

  - type: input
    id: lotus_clickhouse
    attributes:
      label: lotus_clickhouse version
      description: From `mix.lock`, or `mix deps | grep lotus_clickhouse`.
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: lotus
    attributes:
      label: Lotus version
      placeholder: "1.3.0"
    validations:
      required: true

  - type: input
    id: elixir
    attributes:
      label: Elixir and OTP versions
      placeholder: "Elixir 1.20.1, OTP 29"
    validations:
      required: true

  - type: input
    id: clickhouse
    attributes:
      label: ClickHouse server version
      description: From `SELECT version()`. Say if it is ClickHouse Cloud.
      placeholder: "24.8.4.13"
    validations:
      required: true

  - type: input
    id: driver
    attributes:
      label: Driver versions
      description: "`ch` and `ecto_ch`, from `mix.lock`."
      placeholder: "ch 0.9.2, ecto_ch 0.11.1"
    validations:
      required: true

  - type: textarea
    id: query
    attributes:
      label: The query
      description: The Lotus statement and its variable values, or the filters, sorts and pagination you applied. The table definition (`SHOW CREATE TABLE`) helps when it is about types or introspection.
      render: sql
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The error, with the ClickHouse error code and the stacktrace, or the wrong result.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I use a release from Hex, not `main`.
          required: true
        - label: I searched the open and closed issues.
          required: true
        - label: I removed passwords, hostnames and private data from what I pasted.
          required: true
